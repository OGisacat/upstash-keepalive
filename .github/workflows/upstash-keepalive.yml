name: Upstash Keep Alive

on:
  schedule:
    # 每天 UTC 01:17 运行（北京时间 09:17），降低被判定为长期不活跃的概率
    - cron: "17 1 * * *"
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Upstash Redis active
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          set -uo pipefail

          # ── 工具函数 ──────────────────────────────────────

          ts() { date -u '+%Y-%m-%d %H:%M:%S UTC'; }

          # 带重试的 curl 封装，最多 3 次，间隔 5 秒
          redis_call() {
            local cmd="$1"
            local attempt=1
            local max_attempts=3
            local resp=""
            while [ $attempt -le $max_attempts ]; do
              resp=$(curl -fsS --max-time 15 -X POST \
                "${UPSTASH_REDIS_REST_URL}/${cmd}" \
                -H "Authorization: Bearer ${UPSTASH_REDIS_REST_TOKEN}" 2>&1) && break
              echo "  [$(ts)] Attempt $attempt/$max_attempts failed for ${cmd}, retrying in 5s..."
              sleep 5
              attempt=$((attempt + 1))
            done
            if [ $attempt -gt $max_attempts ]; then
              echo "  [$(ts)] ERROR: ${cmd} failed after $max_attempts attempts"
              return 1
            fi
            echo "$resp"
            return 0
          }

          # ── 检查 secrets ─────────────────────────────────

          if [ -z "${UPSTASH_REDIS_REST_URL:-}" ] || [ -z "${UPSTASH_REDIS_REST_TOKEN:-}" ]; then
            echo "Missing secrets UPSTASH_REDIS_REST_URL or UPSTASH_REDIS_REST_TOKEN"
            exit 1
          fi

          echo "============================================"
          echo "  Upstash Keep-Alive  ·  $(ts)"
          echo "============================================"
          echo ""

          # ── 随机延迟 0-180 秒，让每天执行时间不完全一样 ──
          delay=$((RANDOM % 181))
          echo "[$(ts)] Random startup delay: ${delay}s"
          sleep "$delay"
          echo "[$(ts)] Delay complete, starting operations..."
          echo ""

          # ── PING（始终执行）────────────────────────────────

          echo "── PING ──"
          ping_resp=$(redis_call "ping") || { echo "PING failed, aborting."; exit 1; }
          echo "  Response: $ping_resp"
          echo "$ping_resp" | grep -q 'PONG'
          echo "  Status: OK"
          echo ""

          # ── 写入 keepalive 标记 ──────────────────────────
          #
          # 往 Redis 写一个带 TTL 的 key，确保数据库里始终有"数据活动"
          # Upstash 判定活跃度不仅看连接，也看是否有实际数据操作
          # key 设 172800 秒（48 小时）TTL，每天刷新，不会堆积垃圾

          echo "── WRITE keepalive marker ──"
          now=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          write_resp=$(redis_call "set/keepalive:last_run/${now}/EX/172800") || true
          echo "  SET keepalive:last_run = $now (TTL 48h)"
          echo "  Response: $write_resp"
          echo ""

          # 额外写一个计数器，记录总执行次数
          echo "── INCR keepalive counter ──"
          incr_resp=$(redis_call "incr/keepalive:run_count") || true
          echo "  Response: $incr_resp"
          echo ""

          # ── 三组读操作，随机选一组 ─────────────────────────
          #
          #  Group A: 数据库概览 — DBSIZE / TIME / RANDOMKEY / INFO keyspace
          #  Group B: 服务器状态 — TIME / INFO server / INFO stats / DBSIZE
          #  Group C: 内存与连接 — INFO memory / INFO clients / GET counter / TIME
          #
          # 每组 4 个读命令 + 前面 PING + 2 个写 = 共 7 个命令，日志量充足

          group=$((RANDOM % 3))
          failed=0

          run_op() {
            local label="$1"
            local cmd="$2"
            local validate_pattern="$3"
            echo "── ${label} ──"
            local resp
            resp=$(redis_call "$cmd")
            local rc=$?
            if [ $rc -ne 0 ]; then
              echo "  Status: FAILED"
              failed=$((failed + 1))
              return
            fi
            echo "  Response: $resp"
            if [ -n "$validate_pattern" ]; then
              if echo "$resp" | grep -Eq "$validate_pattern"; then
                echo "  Status: OK"
              else
                echo "  Status: WARN (unexpected format)"
                failed=$((failed + 1))
              fi
            else
              echo "  Status: OK (no validation)"
            fi
            echo ""
          }

          case $group in
            0)
              echo ">>> Selected Group A: Database Overview"
              echo ""
              run_op "DBSIZE"          "dbsize"              '"result"\s*:\s*[0-9]+'
              run_op "TIME"            "time"                '"result"\s*:\s*\['
              run_op "RANDOMKEY"       "randomkey"           '"result"'
              run_op "INFO keyspace"   "info/keyspace"       '"result"'
              ;;
            1)
              echo ">>> Selected Group B: Server Status"
              echo ""
              run_op "TIME"            "time"                '"result"\s*:\s*\['
              run_op "INFO server"     "info/server"         '"result"'
              run_op "INFO stats"      "info/stats"          '"result"'
              run_op "DBSIZE"          "dbsize"              '"result"\s*:\s*[0-9]+'
              ;;
            2)
              echo ">>> Selected Group C: Memory & Clients"
              echo ""
              run_op "INFO memory"     "info/memory"         '"result"'
              run_op "INFO clients"    "info/clients"        '"result"'
              run_op "GET run_count"   "get/keepalive:run_count"  '"result"'
              run_op "TIME"            "time"                '"result"\s*:\s*\['
              ;;
          esac

          # ── 结果汇总 ───────────────────────────────────────

          echo "============================================"
          if [ $failed -eq 0 ]; then
            echo "  All operations succeeded."
          else
            echo "  WARNING: $failed operation(s) returned unexpected results."
            echo "  (Non-fatal — keepalive traffic was still generated.)"
          fi
          echo "  Finished at $(ts)"
          echo "============================================"

          # 只要 PING 成功就算 keepalive 达成，其余异常不阻塞流程
          exit 0

      # ── 防止 GitHub 60 天无活动自动禁用 scheduled workflow ──
      #
      # GitHub 政策：仓库 60 天没有 push/PR/issue 等活动，
      # 会自动禁用所有 scheduled workflows 并发邮件通知。
      # 这一步用 GitHub API 每次运行时"重新启用"自身（幂等操作），
      # 即使被禁用也能通过手动 workflow_dispatch 触发后自动恢复。
      - name: Prevent GitHub from disabling this workflow
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            for (const wf of workflows.data.workflows) {
              if (wf.state !== 'active') {
                console.log(`Re-enabling workflow: ${wf.name} (${wf.id})`);
                await github.rest.actions.enableWorkflow({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: wf.id,
                });
              }
            }
            console.log('All workflows are active.');
